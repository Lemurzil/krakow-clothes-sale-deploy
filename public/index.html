<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f0e8"><meta name="description" content="Clothes for sale in Krakow. Browse current availability, sizes and prices.">
<title>Krakow Clothes Sale</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="site-header"><a class="logo" href="/">KRAKOW <span>CLOSET</span></a><div class="pickup">Local pickup &middot; Krakow</div></header>
<main>
<section class="hero compact-original-hero">
  <h1>Krakow Clothes Sale</h1>
  <p class="hero-summary" id="summaryLine">Loading items...</p>
</section>
<section class="catalog">
  <div class="catalog-head">
    <div><p class="eyebrow">THE COLLECTION</p><h2>Shop the closet</h2></div>
  </div>
  <div class="catalog-tools">
    <div class="search-row">
      <input id="searchInput" type="search" autocomplete="off" placeholder="Search: jacket, sweater, size S, #012..." aria-label="Search clothes">
      <span id="resultCount"></span>
    </div>
    <div class="category-chips" id="categoryChips" aria-label="Quick category filters"></div>
  </div>
  <div class="grid" id="grid"></div>
</section>
</main>
<dialog id="itemDialog"><button class="close" id="closeDialog" aria-label="Close">&times;</button><div id="dialogContent"></div></dialog>
<footer>Private clothes sale &middot; Krakow, Poland &middot; Prices in PLN</footer><script src="/app.js" defer></script>
</body></html>
